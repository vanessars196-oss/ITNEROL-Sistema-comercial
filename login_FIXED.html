<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITNEROL — Acesso ao Sistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --laranja: #F07800;
      --laranja2: #D96000;
      --preto: #0a0f1e;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--preto);
      overflow: hidden;
    }

    /* ── BACKGROUND ANIMADO ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(240,120,0,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(21,101,192,0.1) 0%, transparent 55%),
                  linear-gradient(135deg, #0a0f1e 0%, #111827 100%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; animation: float 8s ease-in-out infinite;
    }
    .orb1 { width: 400px; height: 400px; background: rgba(240,120,0,0.08); top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 300px; height: 300px; background: rgba(21,101,192,0.06); bottom: -80px; right: -80px; animation-delay: -4s; }
    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.05); }
    }

    /* ── CONTAINER ── */
    .login-wrap {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 44px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: none; }
    }

    /* ── LOGO ── */
    .login-logo {
      text-align: center; margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--laranja), var(--laranja2));
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(240,120,0,0.35);
    }
    .logo-icon svg { width: 34px; height: 34px; }
    .logo-titulo { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .logo-sub { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 4px; letter-spacing: 0.05em; }
    .logo-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(240,120,0,0.4), transparent);
      margin: 24px 0 28px;
    }
    .login-title { font-size: 1rem; font-weight: 600; color: rgba(255,255,255,0.85); text-align: center; margin-bottom: 24px; }

    /* ── FORM ── */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.45); margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-wrap .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.3); pointer-events: none;
    }
    .form-group input {
      width: 100%; padding: 13px 14px 13px 44px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff; font-size: 0.92rem; font-family: inherit;
      outline: none; transition: all 0.2s;
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.25); }
    .form-group input:focus {
      border-color: var(--laranja);
      background: rgba(240,120,0,0.08);
      box-shadow: 0 0 0 3px rgba(240,120,0,0.15);
    }

    /* Toggle senha */
    .toggle-senha {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.3); padding: 2px;
      transition: color 0.2s;
    }
    .toggle-senha:hover { color: rgba(255,255,255,0.7); }

    /* ── ERRO ── */
    .login-erro {
      background: rgba(198,40,40,0.15); border: 1px solid rgba(198,40,40,0.3);
      border-radius: 8px; padding: 12px 14px;
      color: #fca5a5; font-size: 0.82rem; font-weight: 500;
      margin-bottom: 18px; display: none; align-items: center; gap: 8px;
    }
    .login-erro.show { display: flex; }

    /* ── BTN ENTRAR ── */
    .btn-entrar {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--laranja), var(--laranja2));
      color: white; font-size: 0.95rem; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      transition: all 0.2s; letter-spacing: 0.03em;
      box-shadow: 0 4px 16px rgba(240,120,0,0.35);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-entrar:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(240,120,0,0.45); }
    .btn-entrar:active:not(:disabled) { transform: translateY(0); }
    .btn-entrar:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    .btn-entrar.loading .spinner { display: block; }
    .btn-entrar.loading .btn-txt { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    .login-footer {
      text-align: center; margin-top: 28px;
      font-size: 0.72rem; color: rgba(255,255,255,0.2);
      letter-spacing: 0.03em;
    }
    .login-footer span { color: rgba(240,120,0,0.6); }

    /* ── CREDENCIAIS (dica) ── */
    .cred-hint {
      margin-top: 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; padding: 14px;
    }
    .cred-hint-title {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: rgba(255,255,255,0.3); margin-bottom: 10px;
    }
    .cred-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
    }
    .cred-row:last-child { border-bottom: none; }
    .cred-row:hover .cred-email { color: var(--laranja); }
    .cred-email { font-size: 0.75rem; color: rgba(255,255,255,0.5); transition: color 0.2s; }
    .cred-perfil {
      font-size: 0.65rem; font-weight: 700; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .perfil-admin { background: rgba(240,120,0,0.2); color: var(--laranja); }
    .perfil-comercial { background: rgba(21,101,192,0.2); color: #60a5fa; }
    .perfil-visualizador { background: rgba(100,116,139,0.2); color: #94a3b8; }
  </style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="login-wrap">
  <div class="login-box">

    <!-- LOGO -->
    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M18 11l-5-9H8L3 11v8h2v-1h14v1h2v-8h-3zm-6-7l4 7H8l4-7zm-7 9l1-2h12l1 2H5z"/></svg>
      </div>
      <div class="logo-titulo">ITNEROL</div>
      <div class="logo-sub">SISTEMA COMERCIAL INTERNO</div>
    </div>

    <div class="logo-divider"></div>
    <div class="login-title">Faça login para continuar</div>

    <!-- ERRO -->
    <div class="login-erro" id="login-erro">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <span id="login-erro-msg">Usuário ou senha incorretos.</span>
    </div>

    <!-- FORMULÁRIO -->
    <form id="login-form" onsubmit="fazerLogin(event)">
      <div class="form-group">
        <label>E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </span>
          <input type="email" id="login-email" placeholder="seu@email.com.br" required autocomplete="email"/>
        </div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="login-senha" placeholder="••••••••" required autocomplete="current-password" id="senha-input"/>
          <button type="button" class="toggle-senha" onclick="toggleSenha()" id="toggle-senha-btn">
            <svg id="ico-eye" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-entrar" id="btn-entrar">
        <span class="spinner"></span>
        <span class="btn-txt">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="margin-right:6px;vertical-align:middle"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
          Entrar no Sistema
        </span>
      </button>
    </form>

    <!-- DICA DE CREDENCIAIS -->
    <div class="cred-hint">
      <div class="cred-hint-title">🔑 Acessos disponíveis (clique para preencher)</div>
      <div class="cred-row" onclick="preencherCred('admin@itnerol.com.br','itnerol2025')">
        <span class="cred-email"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="650401080c0b250c110b00170a094b060a084b0717">[email&#160;protected]</a></span>
        <span class="cred-perfil perfil-admin">Admin</span>
      </div>
      <div class="cred-row" onclick="preencherCred('comercial@itnerol.com.br','comercial123')">
        <span class="cred-email"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="0f6c60626a7d6c666e634f667b616a7d6063216c6062216d7d">[email&#160;protected]</a></span>
        <span class="cred-perfil perfil-comercial">Comercial</span>
      </div>
      <div class="cred-row" onclick="preencherCred('view@itnerol.com.br','view123')">
        <span class="cred-email"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="b3c5dad6c4f3dac7ddd6c1dcdf9dd0dcde9dd1c1">[email&#160;protected]</a></span>
        <span class="cred-perfil perfil-visualizador">Visualizador</span>
      </div>
    </div>

    <div class="login-footer">
      © 2025 <span>ITNEROL Transportes</span> — Sistema Interno
    </div>
  </div>
</div>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
  // Já está logado? Redireciona direto
  if (sessionStorage.getItem('crm_user')) {
    window.location.href = 'index.html';
  }

  async function fazerLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const senha = document.getElementById('login-senha').value;
    const btn   = document.getElementById('btn-entrar');
    const erro  = document.getElementById('login-erro');

    // Loading
    btn.classList.add('loading');
    btn.disabled = true;
    erro.classList.remove('show');

    try {
      let users = [];
      let modoOffline = false;

      // Tenta buscar online (timeout 5s)
      try {
        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 5000);
        const resp = await fetch('./data.json?_=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(tid);
        const data = await resp.json();
        const dados = (data && data.dados) || data;
        users = (dados && Array.isArray(dados.usuarios)) ? dados.usuarios : [];
        // Salvar cache de usuários para login offline futuro
        _salvarUsuariosCache(users);
      } catch(netErr) {
        // Sem internet: tentar cache local
        modoOffline = true;
        users = await _lerUsuariosCache();
        if (users.length === 0) {
          throw new Error('SEM_CACHE');
        }
        // Aviso visual de modo offline
        mostrarAvisoOffline();
      }

      const user = users.find(u =>
        u.email?.toLowerCase() === email &&
        u.senha_hash === senha &&
        u.ativo !== false
      );

      if (user) {
        // Salva sessão
        sessionStorage.setItem('crm_user', JSON.stringify({
          id: user.id,
          nome: user.nome,
          email: user.email,
          perfil: user.perfil
        }));

        // Atualiza último acesso somente se online
        if (!modoOffline) {
          if (false) fetch(`../tables/crm_users/${user.id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ultimo_acesso: new Date().toISOString() })
          }).catch(() => {});
        }

        // Animação de sucesso
        const origemMsg = modoOffline ? '📵 Entrando no modo offline...' : `Bem-vindo, ${user.nome.split(' ')[0]}!`;
        btn.style.background = modoOffline
          ? 'linear-gradient(135deg, #F07800, #D96000)'
          : 'linear-gradient(135deg, #2E7D32, #1B5E20)';
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> <span>${origemMsg}</span>`;

        setTimeout(() => { window.location.href = 'index.html'; }, 900);
      } else {
        erro.classList.add('show');
        document.getElementById('login-erro-msg').textContent = 'E-mail ou senha incorretos. Verifique e tente novamente.';
        btn.classList.remove('loading');
        btn.disabled = false;
        document.querySelector('.login-box').style.animation = 'none';
        document.querySelector('.login-box').offsetHeight;
        document.querySelector('.login-box').style.animation = 'shake 0.4s ease';
      }
    } catch(err) {
      erro.classList.add('show');
      const semCache = err.message === 'SEM_CACHE';
      document.getElementById('login-erro-msg').textContent = semCache
        ? '📵 Sem internet e sem cache local. Acesse online ao menos uma vez para habilitar o login offline.'
        : 'Erro de conexão. Tente novamente.';
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  // ── Cache de usuários no IndexedDB (login offline) ──────────────────
  function _dbUsuarios() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('itnerol_offline', 2);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('cache_crm_users'))
          db.createObjectStore('cache_crm_users', { keyPath: 'id' });
      };
      r.onsuccess = e => res(e.target.result);
      r.onerror   = e => rej(e.target.error);
    });
  }
  async function _salvarUsuariosCache(users) {
    try {
      const db = await _dbUsuarios();
      if (!db.objectStoreNames.contains('cache_crm_users')) return;
      const tx = db.transaction('cache_crm_users', 'readwrite');
      const st = tx.objectStore('cache_crm_users');
      st.clear();
      users.forEach(u => { if (u.id) st.put(u); });
    } catch(e) { console.warn('Cache usuários:', e); }
  }
  async function _lerUsuariosCache() {
    try {
      const db = await _dbUsuarios();
      if (!db.objectStoreNames.contains('cache_crm_users')) return [];
      return await new Promise((res, rej) => {
        const tx  = db.transaction('cache_crm_users', 'readonly');
        const req = tx.objectStore('cache_crm_users').getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror   = () => rej(req.error);
      });
    } catch(e) { return []; }
  }

  function mostrarAvisoOffline() {
    // Injeta banner de aviso de modo offline no formulário
    if (document.getElementById('aviso-offline')) return;
    const div = document.createElement('div');
    div.id = 'aviso-offline';
    div.style.cssText = `background:rgba(240,120,0,0.12);border:1px solid rgba(240,120,0,0.35);
      border-radius:8px;padding:10px 14px;margin-bottom:16px;
      color:#fdba74;font-size:.78rem;display:flex;align-items:center;gap:8px;`;
    div.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M1 1l22 22-1.41 1.41L17.17 20H2v-3c0-1.1.89-2 2-2h1.17l-4.83-4.83A9.97 9.97 0 012 12C2 6.48 6.48 2 12 2c1.74 0 3.38.45 4.83 1.17L18.83 5H19a3 3 0 013 3v1.17l-1.41-1.41A1 1 0 0020 8V8a1 1 0 00-1-1h-1.17l-1.91-1.91A8 8 0 0012 4C7.58 4 4 7.58 4 12c0 1.1.18 2.15.5 3.12L1 1z"/></svg>
      <span><strong>Modo Offline</strong> — usando dados salvos localmente.</span>`;
    const form = document.getElementById('login-form');
    form.parentNode.insertBefore(div, form);
  }


  // Detectar offline ao carregar
  window.addEventListener('DOMContentLoaded', () => {
    if (!navigator.onLine) mostrarAvisoOffline();
  });

  function toggleSenha() {
    const input = document.getElementById('login-senha');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function preencherCred(email, senha) {
    document.getElementById('login-email').value = email;
    document.getElementById('login-senha').value = senha;
    document.getElementById('login-email').focus();
  }
</script>

  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
